name: update radar
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -I radar.py
      - name: commit snapshot
        run: |
          git config user.name "jfd-agent-lab"
          git config user.email "jfd-agent-lab@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "radar: snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
